<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>日语精听 · 意见与反馈</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#21372b;font:13px/1.55 "Microsoft YaHei","PingFang SC",sans-serif}
    main{max-width:540px;margin:auto;padding:12px}label{display:block;margin-bottom:9px;font-weight:600}label span{display:block;margin-bottom:4px}
    textarea,input{display:block;width:100%;padding:8px;border:1px solid #cfddd3;border-radius:6px;background:#fff;color:#202124;font:inherit}
    textarea{min-height:93px;resize:vertical}textarea:focus,input:focus{outline:2px solid #7bbd96;outline-offset:1px}
    button{padding:8px 15px;border:0;border-radius:6px;background:#247a57;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:hover{background:#176746}p{margin:7px 0 0;color:#6b786e;font-size:11px}a{color:#176b4a}.honeypot{position:absolute;left:-9999px}
  </style>
</head>
<body>
  <main>
    <form action="https://formsubmit.co/realsmy1985@yahoo.co.jp" method="POST" target="_blank" accept-charset="UTF-8">
      <label><span>反馈内容</span><textarea name="message" maxlength="3000" required placeholder="请描述遇到的问题或你的建议"></textarea></label>
      <label><span>联系邮箱（选填，便于回复）</span><input name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com"></label>
      <input class="honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_subject" value="日语精听：用户意见与反馈">
      <button type="submit">发送反馈</button>
      <p>提交时会打开 FormSubmit 页面，可能需要完成验证码。首次使用后，开发者需验证收件邮箱。请勿填写 API Key 等敏感信息。<a href="./">隐私政策</a></p>
    </form>
  </main>
</body>
</html>
